<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Keeps · New website features</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --ink: #342b30;
      --muted: #71656b;
      --pink: #e9598e;
      --pink-dark: #b83e6c;
      --blush: #fff0f5;
      --lavender: #7651a8;
      --cream: #fffaf5;
      --line: #edcfda;
    }
    html, body { margin: 0; background: #eee; }
    body { font-family: Arial, Helvetica, sans-serif; color: var(--ink); }
    .canvas {
      position: relative;
      overflow: hidden;
      zoom: .5;
      background:
        radial-gradient(circle at 92% 4%, rgba(255, 173, 203, .36), transparent 24%),
        radial-gradient(circle at 2% 84%, rgba(214, 195, 235, .42), transparent 22%),
        linear-gradient(150deg, #fffdfa 0%, #fff4f8 58%, #faf6ff 100%);
    }
    .canvas::before,
    .canvas::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(233, 89, 142, .16);
      border-radius: 50%;
    }
    .canvas::before { width: 440px; height: 440px; right: -230px; top: 210px; }
    .canvas::after { width: 330px; height: 330px; left: -170px; bottom: 210px; }
    .content { position: relative; z-index: 2; height: 100%; }
    .brand-row { display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 900; }
    .brand i { color: var(--pink); font-style: normal; }
    .new-pill {
      padding: 10px 16px;
      border: 1px solid #e8c5d3;
      border-radius: 999px;
      color: var(--pink-dark);
      background: rgba(255,255,255,.78);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: .12em;
    }
    h1 { margin: 0; letter-spacing: -.055em; line-height: .98; }
    h1 em { color: var(--pink-dark); font-style: normal; }
    .dek { margin: 0; color: var(--muted); line-height: 1.5; }
    .feature-card {
      padding: 18px;
      border: 1px solid rgba(221, 181, 196, .88);
      border-radius: 32px;
      background: rgba(255,255,255,.9);
      box-shadow: 0 22px 60px rgba(91, 52, 68, .10);
    }
    .feature-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 14px;
    }
    .feature-heading > div { display: flex; align-items: center; gap: 14px; }
    .number {
      width: 46px; height: 46px; display: grid; place-items: center;
      border-radius: 15px; color: #fff; background: var(--pink);
      font-size: 15px; font-weight: 900;
    }
    .number.purple { background: var(--lavender); }
    .feature-heading strong { display: block; font-size: 24px; }
    .feature-heading small { display: block; margin-top: 3px; color: var(--muted); font-size: 15px; }
    .tag { color: var(--pink-dark); font-size: 13px; font-weight: 900; letter-spacing: .1em; }
    .browser-shot {
      position: relative;
      overflow: hidden;
      border: 1px solid #e4d8dd;
      border-radius: 21px;
      background: #f7f3f1;
    }
    .browser-bar {
      position: absolute; z-index: 2; inset: 0 0 auto 0; height: 32px;
      display: flex; align-items: center; gap: 7px; padding: 0 13px;
      border-bottom: 1px solid rgba(213,199,204,.8); background: rgba(255,255,255,.94);
    }
    .browser-bar i { width: 7px; height: 7px; border-radius: 50%; background: #f2b5ca; }
    .browser-bar i:nth-child(2) { background: #ead589; }
    .browser-bar i:nth-child(3) { background: #a9d7c2; }
    .browser-shot img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .footer-cta {
      display: flex; align-items: center; justify-content: space-between; gap: 24px;
      border-radius: 24px; color: #fff; background: linear-gradient(135deg, #eb6798, #d9477d);
      box-shadow: 0 18px 34px rgba(217,71,125,.23);
    }
    .footer-cta strong { display: block; }
    .footer-cta span { opacity: .9; }
    .footer-cta b { font-size: 30px; }

    .story { width: 1080px; height: 1920px; }
    .story .content { padding: 72px 70px 62px; display: flex; flex-direction: column; }
    .story h1 { max-width: 900px; margin-top: 52px; font-size: 86px; }
    .story .dek { max-width: 820px; margin-top: 24px; font-size: 25px; }
    .story .features { margin-top: 46px; display: grid; gap: 28px; }
    .story .feature-card { padding: 20px; border-radius: 30px; }
    .story .browser-shot { height: 420px; }
    .story .random img { object-position: center 52%; }
    .story .group img { object-position: center 33%; }
    .story .footer-cta { margin-top: auto; padding: 26px 30px; }
    .story .footer-cta strong { font-size: 27px; }
    .story .footer-cta span { font-size: 18px; }

    .post { width: 1080px; height: 1350px; }
    .post .content { padding: 50px 54px 42px; display: flex; flex-direction: column; }
    .post h1 { max-width: 900px; margin-top: 28px; font-size: 64px; }
    .post .dek { margin-top: 14px; font-size: 20px; }
    .post .features { margin-top: 27px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .post .feature-card { padding: 14px; border-radius: 25px; }
    .post .feature-heading { min-height: 80px; margin-bottom: 10px; align-items: flex-start; }
    .post .feature-heading > div { align-items: flex-start; gap: 9px; }
    .post .number { width: 38px; height: 38px; border-radius: 12px; }
    .post .feature-heading strong { font-size: 20px; }
    .post .feature-heading small { font-size: 13px; line-height: 1.35; }
    .post .tag { display: none; }
    .post .browser-shot { height: 610px; }
    .post .random img { object-position: 45% center; }
    .post .group img { object-position: center center; }
    .post .footer-cta { margin-top: auto; padding: 20px 24px; }
    .post .footer-cta strong { font-size: 23px; }
    .post .footer-cta span { font-size: 16px; }
  </style>
</head>
<body>
  <main id="campaign"></main>
  <script>
    const params = new URLSearchParams(location.search);
    const format = params.get("format") === "post" ? "post" : "story";
    const isStory = format === "story";
    document.querySelector("#campaign").innerHTML = `
      <section class="canvas ${format}">
        <div class="content">
          <div class="brand-row">
            <div class="brand"><i>✿</i> Little Keeps</div>
            <div class="new-pill">NEW ON THE WEBSITE</div>
          </div>
          <h1>Two little updates.<br><em>Way easier ordering.</em></h1>
          <p class="dek">Stuck on colours—or ordering with a whole group? The website can help now.</p>
          <div class="features">
            <article class="feature-card">
              <div class="feature-heading">
                <div><span class="number">01</span><span><strong>Surprise Me ✨</strong><small>One tap gives you a complete random colour combination.</small></span></div>
                <span class="tag">NO MORE OVERTHINKING</span>
              </div>
              <div class="browser-shot random">
                <div class="browser-bar"><i></i><i></i><i></i></div>
                <img src="./screenshots/random-colour-generator-ui.png" alt="Little Keeps random colour generator on the website">
              </div>
            </article>
            <article class="feature-card">
              <div class="feature-heading">
                <div><span class="number purple">02</span><span><strong>Group Orders</strong><small>Share one link. Each person designs. You review and pay once.</small></span></div>
                <span class="tag">NO SCREENSHOTS NEEDED</span>
              </div>
              <div class="browser-shot group">
                <div class="browser-bar"><i></i><i></i><i></i></div>
                <img src="${isStory ? "./screenshots/group-order-ui.png" : "./screenshots/group-order-modal-ui.png"}" alt="Little Keeps Group Order interface on the website">
              </div>
            </article>
          </div>
          <div class="footer-cta">
            <div><strong>Try both on the Little Keeps website</strong><span>little-keeps.vercel.app</span></div>
            <b>→</b>
          </div>
        </div>
      </section>`;
  </script>
</body>
</html>
